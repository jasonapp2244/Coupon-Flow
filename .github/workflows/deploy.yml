# Redeploys the CloudPanel server on every push to main (and on demand from the Actions tab).
# The server pulls, builds and updates itself with Coupon_Flow_Backend/deploy/cloudpanel/git-deploy.sh.
#
# Off until these repository secrets exist (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server IP or hostname
#   DEPLOY_SSH_KEY  private key whose public half is in the server's /root/.ssh/authorized_keys
#   DEPLOY_DOMAIN   optional, default couponhub.devonlinetestserver.com
# The first install is done by hand on the server (it asks for the database and admin).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice::Auto-deploy is off: add DEPLOY_HOST and DEPLOY_SSH_KEY secrets to turn it on."
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "root@$HOST" \
            "test -f /home/*/htdocs/${DOMAIN:-couponhub.devonlinetestserver.com}/.env || { echo 'Not installed yet: run git-deploy.sh by hand once.'; exit 1; }; \
             bash /root/coupon-follow-src/Coupon_Flow_Backend/deploy/cloudpanel/git-deploy.sh ${DOMAIN:-couponhub.devonlinetestserver.com} main < /dev/null"
